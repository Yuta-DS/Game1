; Overrides for tools/pack_split.gd, which decides what goes in Core and in
; each area's Pack (ADR-0001, issue #37). Everything here is optional: with an
; empty file the split is worked out from what the game references.

[core]

; Files that always ship in Core, with everything they use, even when only an
; area uses them: an asset the Hub loads by a path built at runtime, or one
; worth downloading up front. res:// paths; * matches anything, including /.
;   pin=["res://assets/audio/minigame/*.ogg"]
pin=[]

; The first-load size the build reports Core against, in MB.
budget_mb=100

[shared]

; Shared packs smaller than this (MB) are merged into the nearest larger
; Shared pack: one more download in exchange for a little extra data.
merge_below_mb=5.0
