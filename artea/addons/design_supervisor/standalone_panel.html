<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; --bg:#f6f7fb; --card:#fff; --text:#171923; --muted:#677085; --line:#d9deea; --accent:#6d4aff; --danger:#b42318; --good:#16794c; }
    :root.dark { --bg:#15161a; --card:#202228; --text:#f5f6f8; --muted:#aeb6c5; --line:#3c414c; --accent:#a891ff; --danger:#ff8b82; --good:#65d39b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,sans-serif; }
    main { padding:14px; max-width:760px; margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    h1 { font-size:18px; margin:0; }
    .badge { border:1px solid var(--line); border-radius:999px; padding:4px 9px; color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
    .muted { color:var(--muted); }
    .error { color:var(--danger); }
    .good { color:var(--good); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .grow { flex:1 1 240px; }
    label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    input,button,textarea { font:inherit; }
    input,textarea { width:100%; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
    button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 11px; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { color:var(--danger); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns:88px repeat(3,minmax(72px,1fr)); gap:7px; align-items:center; }
    .grid input { text-align:right; }
    .section-title { font-weight:650; margin-bottom:8px; }
    #status { min-height:20px; }
    code { overflow-wrap:anywhere; }
  </style>
</head>
<body>
<main>
  <header><h1>Visual Design Supervisor</h1><span class="badge" id="connection">Starting…</span></header>
  <section class="card" id="connectCard">
    <div class="section-title">Connect to Godot</div>
    <p class="muted">Connection is automatic when the Godot add-on is running. The token field is only a fallback.</p>
    <div class="row"><input class="grow" id="token" type="password" placeholder="Connection token" /><button class="primary" id="connect">Connect</button></div>
  </section>
  <section class="card" id="objectCard" hidden>
    <div class="row"><div class="grow"><div class="section-title" id="objectName">No Node3D selected</div><code class="muted" id="objectId">—</code></div><button id="refresh">Refresh</button></div>
    <p class="muted" id="revision">Applied revision —</p>
    <div class="grid">
      <strong>Transform</strong><strong>X</strong><strong>Y</strong><strong>Z</strong>
      <span>Position</span><input id="px" type="number" step="0.01"><input id="py" type="number" step="0.01"><input id="pz" type="number" step="0.01">
      <span>Rotation °</span><input id="rx" type="number" step="0.1"><input id="ry" type="number" step="0.1"><input id="rz" type="number" step="0.1">
      <span>Scale</span><input id="sx" type="number" step="0.01"><input id="sy" type="number" step="0.01"><input id="sz" type="number" step="0.01">
    </div>
    <div class="row" style="margin-top:10px"><button class="primary" id="stage">Stage live preview</button><button id="validate">Validate</button><button class="primary" id="apply">Approve & apply</button><button class="danger" id="discard">Discard</button></div>
  </section>
  <section class="card" id="feedbackCard" hidden>
    <div class="section-title">Feedback to Codex</div>
    <textarea id="feedback" rows="3" placeholder="Describe what should change and why…"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" id="sendFeedback">Queue feedback</button><button id="askCodex">Ask Codex to inspect</button></div>
  </section>
  <section class="card"><div id="status" class="muted">Waiting for the host…</div></section>
</main>
<script>window.__VDS_AUTO_TOKEN__ = "__VDS_TOKEN__";</script>
<script>
setTimeout(() => {
  if (window.__VDS_WIDGET_BOOTED__) return;

  const bridgeUrl = "http://127.0.0.1:48231";
  let token = window.__VDS_AUTO_TOKEN__ || "";
  let state = {};
  const byId = id => document.getElementById(id);
  const status = byId("status");
  const connection = byId("connection");
  const connectCard = byId("connectCard");
  const objectCard = byId("objectCard");
  const feedbackCard = byId("feedbackCard");

  function setStatus(message, kind = "muted") {
    status.className = kind;
    status.textContent = message;
  }

  function setConnected(connected) {
    connection.textContent = connected ? "Browser connected" : "Standalone browser mode";
    connection.className = `badge ${connected ? "good" : ""}`;
    connectCard.hidden = connected;
    objectCard.hidden = !connected;
    feedbackCard.hidden = !connected;
  }

  function setVector(prefix, values = []) {
    ["x", "y", "z"].forEach((axis, index) => {
      byId(`${prefix}${axis}`).value = String(values[index] ?? (prefix === "s" ? 1 : 0));
    });
  }

  function readVector(prefix) {
    return ["x", "y", "z"].map(axis => Number(byId(`${prefix}${axis}`).value));
  }

  function render() {
    const selected = state.selected || {};
    const draft = state.draft || {};
    byId("objectName").textContent = selected.name || "No Node3D selected";
    byId("objectId").textContent = selected.design_id || "—";
    byId("revision").textContent = `Applied revision ${state.applied_revision ?? "—"}${draft.draft_id ? ` · LIVE DRAFT ${draft.draft_id}` : ""}`;
    const transform = draft.proposed_transform || selected.transform || {};
    setVector("p", transform.position);
    setVector("r", transform.rotation_degrees);
    setVector("s", transform.scale);
    byId("stage").disabled = !selected.design_id;
    byId("validate").disabled = !draft.draft_id;
    byId("apply").disabled = !draft.draft_id;
    byId("discard").disabled = !draft.draft_id;
    setStatus(
      draft.draft_id
        ? "Live draft preview is active in Godot. Apply or discard it before saving the scene."
        : "Connected directly to the local Godot editor add-on.",
      draft.draft_id ? "error" : "good"
    );
  }

  async function request(path, options = {}) {
    const response = await fetch(`${bridgeUrl}${path}`, {
      ...options,
      headers: {
        authorization: `Bearer ${token}`,
        "content-type": "application/json",
        ...(options.headers || {})
      }
    });
    const payload = await response.json();
    if (!response.ok || payload.ok === false) throw new Error(payload.error || `HTTP ${response.status}`);
    return payload;
  }

  async function command(action, arguments = {}) {
    return request("/command", { method: "POST", body: JSON.stringify({ action, arguments }) });
  }

  async function refresh() {
    const payload = await command("get_state");
    state = payload.state || {};
    render();
  }

  async function run(label, operation) {
    try {
      setStatus(`${label}…`);
      return await operation();
    } catch (error) {
      setStatus(error.message || String(error), "error");
      return null;
    }
  }

  byId("connect").addEventListener("click", () => run("Connecting", async () => {
    token = byId("token").value.trim();
    if (!token) {
      const ready = await fetch(`${bridgeUrl}/ready`);
      if (!ready.ok) throw new Error("Start Godot and enable the Design Supervisor add-on.");
      location.replace(`${bridgeUrl}/panel`);
      return;
    }
    await request("/health");
    setConnected(true);
    await refresh();
  }));
  byId("refresh").addEventListener("click", () => run("Refreshing", refresh));
  byId("stage").addEventListener("click", () => run("Staging live preview", async () => {
    await command("stage_transform", {
      design_id: state.selected?.design_id,
      transform: { position: readVector("p"), rotation_degrees: readVector("r"), scale: readVector("s") }
    });
    await refresh();
  }));
  byId("validate").addEventListener("click", () => run("Validating", async () => {
    const payload = await command("validate_draft");
    setStatus(payload.warnings?.length ? payload.warnings.join(" · ") : "Draft passed available validation checks.", payload.warnings?.length ? "error" : "good");
  }));
  byId("apply").addEventListener("click", () => run("Applying approved draft", async () => {
    const draft = state.draft || {};
    if (!draft.draft_id || !confirm("Apply this exact draft to Godot and add it to Undo history?")) return;
    await command("apply_draft", { draft_id: draft.draft_id, base_revision: draft.base_revision });
    await refresh();
  }));
  byId("discard").addEventListener("click", () => run("Discarding draft", async () => {
    if (!confirm("Discard the active preview and restore the original transform?")) return;
    await command("discard_draft");
    await refresh();
  }));
  byId("sendFeedback").addEventListener("click", () => run("Queuing feedback", async () => {
    const input = byId("feedback");
    const message = input.value.trim();
    if (!message) throw new Error("Write feedback first.");
    await command("submit_feedback", { message });
    input.value = "";
    setStatus("Feedback queued safely for Codex.", "good");
  }));
  byId("askCodex").textContent = "Copy request for Codex";
  byId("askCodex").addEventListener("click", async () => {
    const message = byId("feedback").value.trim() || "Inspect the current Visual Design Supervisor selection and draft before changing anything.";
    const copyText = `${message}\nSelected object: ${state.selected?.design_id || "none"}`;
    try {
      await navigator.clipboard.writeText(copyText);
    } catch {
      const helper = document.createElement("textarea");
      helper.value = copyText;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      helper.remove();
    }
    setStatus("Request copied. Paste it into Codex.", "good");
  });

  setConnected(false);
  run("Finding Godot", async () => {
    if (!token) {
      const ready = await fetch(`${bridgeUrl}/ready`);
      if (!ready.ok) throw new Error("Start Godot and enable the Design Supervisor add-on.");
      location.replace(`${bridgeUrl}/panel`);
      return;
    }
    await request("/health");
    setConnected(true);
    await refresh();
  });
}, 50);
</script>
</body>
</html>
