[plugin]

name="Web Terrain Debug Fix"
description="Works around a terrain_3d GDExtension bug where debug Web exports (including the editor's one-click Web run) request libterrain.web.release.wasm32.wasm, which doesn't exist in a debug export, hanging the load forever. Duplicates the debug wasm under the release filename during debug web exports."
author="Artea"
version="1.0"
script="plugin.gd"
