# Artéa on one EC2 instance: the Web export from /var/www/artea and the Flask
# API (gunicorn on 127.0.0.1:8000, flaskapp.service) under /api, on one origin
# - the game calls location.origin + "/api" (artea/scripts/API_Manager.gd).
# install.sh installs this with __DOMAIN__ filled in; certbot then adds HTTPS
# and the redirect from plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/artea;
    index index.html;

    # The engine and scripts compress well. Pack parts are already gzipped
    # (artea/tools/split-pack.sh) and pck-loader.js inflates them itself, so
    # they must go out as they are, with no Content-Encoding.
    gzip on;
    gzip_types application/javascript application/wasm application/json text/css;

    # Some nginx builds lack the WebAssembly type; streaming compilation needs it.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
    }

    # Parts are named by content hash, so a URL never changes meaning.
    location /parts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is re-checked on every visit: index.html, the loader and
    # the manifests name the current release's parts.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Never compressed: the browser unzips the response, but Godot's
        # HTTPRequest still sees Content-Encoding: gzip and unzips it again,
        # so login read no token and said it couldn't reach the server.
        gzip off;
        # The trailing slash strips /api: /api/login reaches Flask's /login.
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        # The visitor's own address, which Flask trusts with BEHIND_PROXY=1.
        # Set, not appended, so a client can't slip in an address of its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Flask's MAX_UPLOAD_BYTES (20 MB) and AI requests (up to 100 s).
        client_max_body_size 20m;
        proxy_read_timeout 100s;
    }
}
